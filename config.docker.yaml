# Lobby Docker 配置
server:
  host: "0.0.0.0"
  httpPort: 9001
  mqPort: 9002

nats:
  url: "nats://nats:4222"

log:
  level: "info"
  logFile: "lobby"
  errorFile: "lobby_error"
  logDir: "logs"
  maxSize: 500
  maxAge: 30

mongo:
  uri: "mongodb://mongo:27017"
  database: "lobby"

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0

elect:
  mode: "redis"  # 或 "etcd"
  prefix: "/elect/leader"
  ttl: 10
  redis:
    host: "redis"
    port: 6379
  etcd:
    endpoints:
      - "etcd:2379"
    dialTimeout: 5000
