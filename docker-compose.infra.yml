services:
  lobby:
    container_name: lobby-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "9001:9001"
      - "9002:9002"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
    networks:
      - lobby-net
      - mongo-net
      - redis-net
      - nats-net
      - etcd-net

  mongo:
    container_name: mongo
    image: mongo:7.0.39
    restart: "no"
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - mongo-net

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: "no"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - redis-net

  nats:
    container_name: nats
    image: nats:latest
    restart: "no"
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
    networks:
      - nats-net

  etcd:
    container_name: etcd
    image: gcr.io/etcd-development/etcd:v3.5.17
    restart: "no"
    command: >
      etcd
      --name etcd
      --advertise-client-urls http://etcd:2379
      --listen-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - etcd-net

networks:
  lobby-net:
    name: lobby-net
    driver: bridge
  mongo-net:
    name: mongo-net
    driver: bridge
  redis-net:
    name: redis-net
    driver: bridge
  nats-net:
    name: nats-net
    driver: bridge
  etcd-net:
    name: etcd-net
    driver: bridge

volumes:
  mongo-data:
  redis-data:
